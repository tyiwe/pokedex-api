<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pokédex</title>
</head>

<body>
    <header>
        <h1>Minha Pokédex</h1>
    </header>

    <main>
        <form id="searchForm">
            <label for="pokemonInput">Nome do Pokémon</label>
            <input id="pokemonInput" type="text" placeholder="Ex: pikachu" required>
            <button type="submit">Pesquisar</button>
        </form>

        <p id="mensagem" role="status"></p>

        <article id="pokemonCard" hidden>
            <h2 id="pokemonNome"></h2>
            <img id="pokemonImage" alt="">
            <img id="pokemonImageCostas" alt="">
            <img id="pokemonImageShiny" alt="">
            <ul>
                <li>ID: <span id="pokemonId"></span></li>
                <li>Peso: <span id="pokemonPeso"></span></li>
                <li>Tipo: <span id="pokemonTipo"></span></li>
            </ul>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
